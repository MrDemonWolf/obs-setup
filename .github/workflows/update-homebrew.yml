name: Update Homebrew Den

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published obs-setup tag, for example v0.1.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release and archive checksum
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag like v0.1.3; got '$RELEASE_TAG'" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          url="https://github.com/MrDemonWolf/obs-setup/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          sha256="$(curl --fail --location --retry 3 --silent --show-error "$url" | sha256sum | awk '{print $1}')"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "url=$url"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Require Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::Add HOMEBREW_TAP_TOKEN to obs-setup Actions secrets with write access to homebrew-den."
            exit 1
          fi

      - name: Checkout Homebrew Den
        uses: actions/checkout@v4
        with:
          repository: MrDemonWolf/homebrew-den
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-den

      - name: Update formula and catalog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("homebrew-den/Formula/obs-backup.rb")
          text = formula.read_text()
          text, urls = re.subn(r'^  url "[^"]+"$', f'  url "{os.environ["URL"]}"', text, count=1, flags=re.MULTILINE)
          text, hashes = re.subn(r'^  sha256 "[0-9a-f]{64}"$', f'  sha256 "{os.environ["SHA256"]}"', text, count=1, flags=re.MULTILINE)
          if urls != 1 or hashes != 1:
              raise SystemExit("obs-backup formula must contain exactly one source URL and SHA-256")
          formula.write_text(text)

          readme = Path("homebrew-den/README.md")
          text = readme.read_text()
          text, rows = re.subn(
              r'^(\| `obs-backup` \| )[^|]+(\|)',
              rf'\g<1>{os.environ["VERSION"]} \g<2>',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if rows != 1:
              raise SystemExit("obs-backup catalog row not found")
          readme.write_text(text)
          PY

      - name: Open formula update PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd homebrew-den
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="obs-backup-v${VERSION}"
          git checkout -b "$branch"
          git add Formula/obs-backup.rb README.md
          if git diff --cached --quiet; then
            echo "Homebrew Den already has obs-backup v${VERSION}."
            exit 0
          fi
          git commit -m "chore: bump obs-backup to v${VERSION}"
          git push origin "$branch"
          gh pr create \
            --repo MrDemonWolf/homebrew-den \
            --base main \
            --head "$branch" \
            --title "chore: bump obs-backup to v${VERSION}" \
            --body "Automated formula update for [obs-setup ${TAG}](https://github.com/MrDemonWolf/obs-setup/releases/tag/${TAG})."
