name: Build OBS asset bundles

# Renders the overlays and stinger with Remotion, validates the audio timing,
# packages separate Scenes, Stinger, and Masks downloads, and attaches all
# three to the GitHub Release.
#
# macOS runner is REQUIRED: to-hevc.sh encodes HEVC-with-alpha via
# hevc_videotoolbox, which only exists on Apple platforms (no Linux equivalent).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example v0.1.4
        required: true
        type: string

permissions:
  contents: write         # upload the three ZIPs as release assets

jobs:
  bundle:
    runs-on: macos-14     # Apple Silicon — has VideoToolbox
    # Two timer lengths roughly double the heavy transparent-render work.
    # GitHub's hosted-job timeout tops out at 360 minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # job never pushes; upload uses GH_TOKEN env

      # node 24 = what generates package-lock.json locally; npm 10 (node 20)
      # rejects the npm-11 lockfile layout for bundled wasm deps (@emnapi/*).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # npm install, NOT npm ci: npm's lock validation of bundled wasm deps
      # (@tailwindcss/oxide-wasm32-wasi -> @emnapi/*) breaks across npm
      # versions — npm ci fails "Missing @emnapi/core from lock file" no
      # matter which npm generated the lock.
      - name: Install remotion deps
        run: npm install --no-audit --no-fund
        working-directory: remotion

      - name: Ensure ffmpeg + Pillow
        run: |
          ffmpeg -version >/dev/null 2>&1 || brew install ffmpeg
          python3 -m pip install --user --quiet pillow || true

      - name: Choose artifact version and date
        id: release_date
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version like v0.1.4; got '$RELEASE_TAG'" >&2
            exit 1
          fi
          date="$(date +%F)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "package_id=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF guide renderer
        run: python3 -m pip install -r scripts/requirements-release.txt

      - name: Render + package bundle
        env:
          OBS_RELEASE_OUTPUT_DIR: ${{ runner.temp }}/obs-release-downloads
          OBS_RELEASE_DATE: ${{ steps.release_date.outputs.date }}
          OBS_RELEASE_VERSION: ${{ steps.release_date.outputs.version }}
        run: ./release.sh --force

      - name: Locate separate downloads
        id: downloads
        env:
          PACKAGE_ID: ${{ steps.release_date.outputs.package_id }}
        run: |
          echo "scenes=${{ runner.temp }}/obs-release-downloads/OBS-scenes-$PACKAGE_ID.zip" >> "$GITHUB_OUTPUT"
          echo "stinger=${{ runner.temp }}/obs-release-downloads/OBS-stinger-$PACKAGE_ID.zip" >> "$GITHUB_OUTPUT"
          echo "masks=${{ runner.temp }}/obs-release-downloads/OBS-masks-$PACKAGE_ID.zip" >> "$GITHUB_OUTPUT"

      # Manual/dispatch runs: keep each download as its own workflow artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: obs-scenes-${{ steps.release_date.outputs.package_id }}
          path: ${{ steps.downloads.outputs.scenes }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: obs-stinger-${{ steps.release_date.outputs.package_id }}
          path: ${{ steps.downloads.outputs.stinger }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: obs-masks-${{ steps.release_date.outputs.package_id }}
          path: ${{ steps.downloads.outputs.masks }}
          if-no-files-found: error

      # Release runs: attach all three archives to the published release.
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.downloads.outputs.scenes }}" "${{ steps.downloads.outputs.stinger }}" "${{ steps.downloads.outputs.masks }}" --clobber
