name: Build OBS overlay bundle

# Renders the overlays and stinger with Remotion, validates the audio timing,
# packages two independent downloads, and attaches both to the GitHub Release.
#
# macOS runner is REQUIRED: to-hevc.sh encodes HEVC-with-alpha via
# hevc_videotoolbox, which only exists on Apple platforms (no Linux equivalent).

on:
  release:
    types: [published]
  workflow_dispatch: {}   # manual run — builds + uploads an artifact, no release asset

permissions:
  contents: write         # upload both ZIPs as release assets

jobs:
  bundle:
    runs-on: macos-14     # Apple Silicon — has VideoToolbox
    # Measured on a real run: renders ~85 min + SOFTWARE HEVC transcodes
    # (no HW encoder in the VM) ~65 min for countdown+loading-barks ≈ 155 min.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # job never pushes; upload uses GH_TOKEN env

      # node 24 = what generates package-lock.json locally; npm 10 (node 20)
      # rejects the npm-11 lockfile layout for bundled wasm deps (@emnapi/*).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # npm install, NOT npm ci: npm's lock validation of bundled wasm deps
      # (@tailwindcss/oxide-wasm32-wasi -> @emnapi/*) breaks across npm
      # versions — npm ci fails "Missing @emnapi/core from lock file" no
      # matter which npm generated the lock.
      - name: Install remotion deps
        run: npm install --no-audit --no-fund
        working-directory: remotion

      - name: Ensure ffmpeg + Pillow
        run: |
          ffmpeg -version >/dev/null 2>&1 || brew install ffmpeg
          python3 -m pip install --user --quiet pillow || true

      - name: Choose artifact date
        id: release_date
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Render + package bundle
        env:
          OBS_RELEASE_OUTPUT_DIR: ${{ runner.temp }}/obs-release-downloads
          OBS_RELEASE_DATE: ${{ steps.release_date.outputs.date }}
        run: ./release.sh --force

      - name: Locate separate downloads
        id: downloads
        run: |
          date="${{ steps.release_date.outputs.date }}"
          echo "overlays=${{ runner.temp }}/obs-release-downloads/OBS-overlays-$date.zip" >> "$GITHUB_OUTPUT"
          echo "stinger=${{ runner.temp }}/obs-release-downloads/OBS-stinger-$date.zip" >> "$GITHUB_OUTPUT"

      # Manual/dispatch runs: keep each download as its own workflow artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: obs-overlays
          path: ${{ steps.downloads.outputs.overlays }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: obs-stinger
          path: ${{ steps.downloads.outputs.stinger }}
          if-no-files-found: error

      # Release runs: attach both archives to the published release.
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.downloads.outputs.overlays }}" "${{ steps.downloads.outputs.stinger }}" --clobber
